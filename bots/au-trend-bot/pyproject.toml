[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "au-trend-bot"
version = "1.0.0"
description = "Isolated, evidence-labelled Australian ecommerce trend reports"
requires-python = ">=3.12"
dependencies = ["tzdata==2025.2"]

[project.optional-dependencies]
dev = ["ruff==0.12.12"]

[project.scripts]
au-trend-bot = "au_trend_bot.cli:main"

[tool.setuptools.packages.find]
include = ["au_trend_bot*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
