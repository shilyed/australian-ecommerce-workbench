<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23111111%27/%3E%3Cpath d=%27M8 20l5-9 3 5 3-7 5 11z%27 fill=%27%23ffffff%27/%3E%3C/svg%3E" />
    <title>中澳跨境电商工作台</title>
    <script>
      // 在首屏渲染前确定主题，避免深色/浅色闪烁
      (function () {
        try {
          var stored = localStorage.getItem("aew-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || (stored !== "light" && prefersDark);
          var root = document.documentElement;
          root.classList.add(isDark ? "dark" : "light");
          root.dataset.theme = isDark ? "dark" : "light";
          root.style.colorScheme = isDark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#111111" : "#ffffff");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="nike-workspace">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
